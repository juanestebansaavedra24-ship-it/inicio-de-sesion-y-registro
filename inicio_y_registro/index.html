<div class="modal fade" id="INICIARSESION" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Bienvenido por favor inicia sesión</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
     <form>
  <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Correo Electrónico:</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
</div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Contraseña:</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
  
  <button type="submit" class="btn btn-primary">Enviar</button>
</form>
      </div>
      <div class="modal-footer">

  </div>
</div>


<div class="modal fade" id="REGISTRO" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">

      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Bienvenido por favor regístrate</h1>

          <form>

</div>
  <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Contraseña:</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
   <div class="mb-3">
    <label for="exampleInputPassword1" class="form-label">Confirmar Contraseña:</label>
    <input type="password" class="form-control" id="exampleInputPassword1">
  </div>
   <div class="mb-3">
    <label for="exampleInputEmail1" class="form-label">Direccion:</label>
    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
</div>
  <button type="submit" class="btn btn-primary">Enviar</button>

</form>
     </div>
